[package]
name = "subsolve"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
flate2 = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "solver_bench"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
